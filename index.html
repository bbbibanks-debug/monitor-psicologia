  function mostrarConteudo(id, elementoAlvo) {
    document.querySelectorAll(".btn-fonte").forEach(btn => btn.classList.remove("ativo"));
    elementoAlvo.classList.add("ativo");

    const container = document.getElementById("conteudoResultados");
    container.innerHTML = "";

    const artigos = bancoDeDados[id];
    if (artigos && artigos.length > 0) {
      artigos.forEach(art => {
        const div = document.createElement("div");
        div.className = "item-artigo";

        const a = document.createElement("a");
        a.href = art.url;
        a.target = "_blank";
        a.textContent = art.texto || art.url;
        div.appendChild(a);

        if (art.traducao && art.traducao !== art.texto) {
          const span = document.createElement("span");
          span.className = "traducao";
          span.textContent = art.traducao;
          div.appendChild(span);
        }

        container.appendChild(div);
      });
    } else {
      container.innerHTML = '<span class="vazio">Nenhum artigo encontrado para esta fonte no momento.</span>';
    }
  }
</script>
