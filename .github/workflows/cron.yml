name: Atualizar Monitor de Notícias

on:
  schedule:
    # Roda automaticamente todos os dias às 06:00 e às 18:00 (Horário UTC)
    - cron: '0 9,21 * * *'
  workflow_dispatch: # Permite que você clique em um botão para rodar manualmente quando quiser

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependências (inclusive o deep-translator)
      run: |
        pip install -r requirements.txt

    - name: Executar o Script de Raspagem
      run: python atualizar.py

    - name: Salvar e subir as alterações no index.html
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add index.html
        git diff --quiet && git diff --staged --quiet || (git commit -m "Painel atualizado automaticamente pelo robô" && git push)
