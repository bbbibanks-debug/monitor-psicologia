name: Executar Monitor Diario
on:
  schedule:
    - cron: '0 12 * * *' # Roda todo dia às 09:00 AM (Horário de Brasília)
  workflow_dispatch: # Ativa o botão para rodar manualmente
jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: |
        pip install -r requirements.txt
        python atualizar.py
    - name: Salvar alteracoes no GitHub
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add index.html
        git commit -m "Atualizacao automatica diaria do painel" || exit 0
        git push
